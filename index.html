<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>RACE PANEL BLUE GANK 🦈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-y: auto;
        }

        header {
            width: 100%;
            text-align: center;
            border-bottom: 2px solid #1f293d;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 1.4rem;
            color: #00e5ff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        #gpsStatus {
            font-size: 0.85rem;
            color: #ffa502;
            margin-top: 5px;
            font-weight: bold;
        }

        /* Live Speed Display */
        .main-hud {
            text-align: center;
            margin: 15px 0;
        }

        #currentSpeed {
            font-size: 7rem;
            font-weight: 900;
            line-height: 1;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        .unit {
            font-size: 1.1rem;
            color: #74b9ff;
            font-weight: bold;
            letter-spacing: 3px;
        }

        /* Panel Pengaturan (Jarak & Berat) */
        .setup-container {
            width: 100%;
            max-width: 450px;
            background: #141b27;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #233145;
            margin-bottom: 15px;
        }

        .setup-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .setup-row select, .setup-row input {
            width: 110px;
            background: #0b0e14;
            border: 1px solid #00e5ff;
            color: #fff;
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            outline: none;
        }

        /* Grid Data Performance */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 450px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: linear-gradient(145deg, #141b27, #0d131a);
            border: 1px solid #233145;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .stat-box p {
            font-size: 0.75rem;
            color: #a4b0be;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff;
        }

        .highlight { color: #2ed573; }
        .accent { color: #ffa502; }

        /* Bagian Riwayat Balapan (History) */
        .history-container {
            width: 100%;
            max-width: 450px;
            background: #111622;
            border: 1px solid #1f293d;
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #233145;
            padding-bottom: 5px;
        }

        .history-header h3 {
            font-size: 1rem;
            color: #00e5ff;
        }

        #clearHistoryBtn {
            background: transparent;
            color: #ff4757;
            border: none;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        .history-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background: #172030;
            border-left: 4px solid #2ed573;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .history-item .left-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-item .right-info {
            text-align: right;
            font-weight: bold;
            color: #2ed573;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }

        .no-history {
            text-align: center;
            color: #57606f;
            font-size: 0.85rem;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>RACEBOX SMART BLUEGANK 🦈</h1>
        <div id="gpsStatus">Menghubungkan GPS... 🛰️</div>
    </header>

    <div class="main-hud">
        <div id="currentSpeed">0</div>
        <div class="unit">KM/H</div>
    </div>

    <div class="setup-container">
        <div class="setup-row">
            <label for="targetDistance" style="font-weight: bold; color: #00e5ff;">Pilih Jarak Track:</label>
            <select id="targetDistance" onchange="updateTargetLabel()">
                <option value="100">100 Meter</option>
                <option value="200" selected>200 Meter</option>
                <option value="402">402 Meter (1/4 mile)</option>
                <option value="1000">1000 Meter (1 Km)</option>
            </select>
        </div>
        <div class="setup-row">
            <label for="vehicleWeight">Berat Kendaraan + Rider (Kg):</label>
            <input type="number" id="vehicleWeight" value="250" min="50" max="5000">
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <p id="targetTimeLabel">Waktu 200m</p>
            <div class="stat-value highlight" id="timeTarget">0.00s</div>
        </div>
        <div class="stat-box">
            <p>Top Speed Run</p>
            <div class="stat-value accent" id="topSpeed">0.0</div>
        </div>
        <div class="stat-box">
            <p>Est. Max Horse Power</p>
            <div class="stat-value" id="horsePower" style="color: #ff4757;">0 HP</div>
        </div>
        <div class="stat-box">
            <p>Jarak Live</p>
            <div class="stat-value" id="distanceTraveled">0 m</div>
        </div>
    </div>

    <div class="history-container">
        <div class="history-header">
            <h3>LOG RIWAYAT BALAPAN</h3>
            <button id="clearHistoryBtn" onclick="clearHistory()">HAPUS</button>
        </div>
        <div class="history-list" id="historyList">
            </div>
    </div>

<script>
    // State Global
    let maxSpeed = 0;
    let maxHP = 0;
    let totalDistance = 0;
    let prevLat = null, prevLon = null;
    
    let startTime = null;
    let isRaceActive = false;
    let isTargetDone = false;

    // DOM Elements
    const gpsStatus = document.getElementById("gpsStatus");
    const currentSpeedEl = document.getElementById("currentSpeed");
    const topSpeedEl = document.getElementById("topSpeed");
    const timeTargetEl = document.getElementById("timeTarget");
    const distanceTraveledEl = document.getElementById("distanceTraveled");
    const horsePowerEl = document.getElementById("horsePower");
    const historyList = document.getElementById("historyList");
    const targetDistanceSelect = document.getElementById("targetDistance");
    const targetTimeLabel = document.getElementById("targetTimeLabel");
    const vehicleWeightInput = document.getElementById("vehicleWeight");

    window.onload = function() {
        initGPS();
        loadHistoryFromStorage();
        updateTargetLabel();
    };

    // Fungsi mengubah label petunjuk jarak target
    function updateTargetLabel() {
        let currentTarget = targetDistanceSelect.value;
        targetTimeLabel.innerText = "Waktu " + currentTarget + "m";
        autoResetRace(); 
    }

    function initGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(processGPS, handleGPSError, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000
            });
            gpsStatus.innerText = "STANDBY: Siap, tunggu kamu gas! 🚦";
            gpsStatus.style.color = "#ffa502";
        } else {
            gpsStatus.innerText = "Error: Browser tidak mendukung GPS!";
            gpsStatus.style.color = "#ff4757";
        }
    }

    function handleGPSError(error) {
        gpsStatus.innerText = "GPS Error: " + error.message + " ❌";
        gpsStatus.style.color = "#ff4757";
    }

    function processGPS(position) {
        let speedMS = position.coords.speed;
        let timestamp = position.timestamp;
        let lat = position.coords.latitude;
        let lon = position.coords.longitude;

        if (speedMS === null || speedMS < 0) speedMS = 0;
        let speedKMH = speedMS * 3.6;
        
        currentSpeedEl.innerText = Math.round(speedKMH);
        let targetDistanceLimit = parseInt(targetDistanceSelect.value);

        // OTO-START: Mendeteksi akselerasi awal (> 3 km/h)
        if (!isRaceActive && speedKMH > 3 && !isTargetDone) {
            isRaceActive = true;
            startTime = timestamp;
            prevLat = lat;
            prevLon = lon;
            gpsStatus.innerText = "RACING: Sedang merekam aksi... 🔥";
            gpsStatus.style.color = "#2ed573";
        }

        // Jalankan kalkulasi jika balapan sedang berjalan
        if (isRaceActive && !isTargetDone) {
            // 1. Kalkulasi Jarak Kumulatif (Haversine Formula)
            if (prevLat !== null && prevLon !== null) {
                let deltaDist = calculateDistance(prevLat, prevLon, lat, lon);
                totalDistance += deltaDist;
                distanceTraveledEl.innerText = Math.round(totalDistance) + " m";
            }
            prevLat = lat;
            prevLon = lon;

            // 2. Kalkulasi Top Speed
            if (speedKMH > maxSpeed) {
                maxSpeed = speedKMH;
                topSpeedEl.innerText = maxSpeed.toFixed(1);
            }

            // 3. Kalkulasi Durasi Waktu Berjalan
            let elapsedTimeSec = (timestamp - startTime) / 1000;
            timeTargetEl.innerText = elapsedTimeSec.toFixed(2) + "s";

            // 4. Estimasi Horse Power Dinamis (Berdasarkan hukum fisika akselerasi)
            if (elapsedTimeSec > 0.5) { 
                let weight = parseFloat(vehicleWeightInput.value) || 250;
                let calculatedHP = calculateHP(weight, totalDistance, elapsedTimeSec);
                if (calculatedHP > maxHP) {
                    maxHP = calculatedHP;
                    horsePowerEl.innerText = Math.round(maxHP) + " HP";
                }
            }

            // OTO-FINISH: Jika jarak kumulatif menembus target trek
            if (totalDistance >= targetDistanceLimit) {
                isTargetDone = true;
                isRaceActive = false;
                gpsStatus.innerText = "FINISH! Kendaraaan berhenti untuk auto-save 🏁";
                gpsStatus.style.color = "#00e5ff";
                saveRaceLog(targetDistanceLimit, elapsedTimeSec, maxSpeed, Math.round(maxHP));
            }
        }

        // OTO-RESET: Jika sudah finish dan motor berhenti total (< 2 km/h), siap untuk run berikutnya
        if (isTargetDone && speedKMH < 2) {
            autoResetRace();
        }
    }

    // Formula Matematika Haversine untuk menghitung jarak akurat antara 2 Titik Koordinat Bumi
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000; // Radius bumi dalam satuan meter
        let dLat = (lat2 - lat1) * Math.PI / 180;
        let dLon = (lon2 - lon1) * Math.PI / 180;
        let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
        let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    // Formula Estimasi HP (Berdasarkan ET / Elapsed Time standar drag dunia & bobot)
    function calculateHP(weightKg, distanceM, timeSec) {
        if (timeSec <= 0 || distanceM <= 0) return 0;
        let weightLbs = weightKg * 2.20462;
        let timeForQuarterMile = timeSec * Math.pow((402.336 / distanceM), 0.5); // Ekstrapolasi ke skala 1/4 mil jika trek pendek
        let hp = weightLbs / Math.pow((timeForQuarterMile / 5.825), 3);
        return isNaN(hp) || hp < 0 ? 0 : hp;
    }

    function autoResetRace() {
        maxSpeed = 0;
        maxHP = 0;
        totalDistance = 0;
        prevLat = null;
        prevLon = null;
        startTime = null;
        isRaceActive = false;
        isTargetDone = false;

        topSpeedEl.innerText = "0.0";
        timeTargetEl.innerText = "0.00s";
        distanceTraveledEl.innerText = "0 m";
        horsePowerEl.innerText = "0 HP";
        gpsStatus.innerText = "STANDBY: Siap, tunggu kamu gas! 🚦";
        gpsStatus.style.color = "#ffa502";
    }

    // Logika Penyimpanan Riwayat (Local Storage)
    function saveRaceLog(track, time, topspeed, hp) {
        let history = JSON.parse(localStorage.getItem("race_history")) || [];
        let newRecord = {
            id: Date.now(),
            track: track,
            time: time.toFixed(2),
            topspeed: topspeed.toFixed(1),
            hp: hp,
            date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        };
        history.unshift(newRecord);
        localStorage.setItem("race_history", JSON.stringify(history));
        renderHistory(history);
    }

    function loadHistoryFromStorage() {
        let history = JSON.parse(localStorage.getItem("race_history")) || [];
        renderHistory(history);
    }

    function renderHistory(history) {
        if (history.length === 0) {
            historyList.innerHTML = `<div class="no-history">Belum ada riwayat balap resmi.</div>`;
            return;
        }
        historyList.innerHTML = history.map(item => `
            <div class="history-item">
                <div class="left-info">
                    <span style="font-weight: bold; color: #00e5ff;">Trek ${item.track}M (${item.date})</span>
                    <span style="font-size: 0.75rem; color: #a4b0be;">Top: ${item.topspeed} km/h | ${item.hp} HP</span>
                </div>
                <div class="right-info">${item.time}s</div>
            </div>
        `).join('');
    }

    function clearHistory() {
        if(confirm("Hapus semua catatan riwayat balap?")) {
            localStorage.removeItem("race_history");
            renderHistory([]);
        }
    }
</script>
</body>
</html>
